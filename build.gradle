// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
id 'com.android.application' version '8.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
    id 'com.google.gms.google-services' version '4.4.0' apply false
    id 'com.google.dagger.hilt.android' version '2.44.2' apply false
}

ext {
    versions = [
            coreKtx                     : "1.9.0",
            lifecycleRuntimeKtx         : "2.6.2",
            activityCompose             : "1.4.0",
            composeBom                  : "2023.03.00",
            composeMaterial3            : "1.2.0-beta02",
            navigationCompose           : "2.4.0-beta01",
            firebaseAuth                : "19.2.0",
            firebaseBom                 : "29.0.0",
            playServicesAuth            : "20.2.0",
            hiltAndroid                 : "2.44.2",
            hiltNavigationCompose       : "1.0.0-beta01",
            coilCompose                 : "2.6.0",
            coroutinesAndroid           : "1.3.9",
            coroutinesPlayServices      : "1.6.3",
            accompanistUiController     : "0.30.1",
            accompanistPager            : "0.12.0",
            serializationJson           : "1.3.2",
            lifecycleRuntimeCompose     : "2.6.0",
            lifecycleViewModelCompose   : "2.6.0",
            composeRuntimeLiveData      : "1.6.6",
            composeMaterialIconsExtended: "1.6.6",
            junit                       : "4.13.2",
            androidTestJunit            : "1.1.5",
            espressoCore                : "3.5.1"
    ]
}