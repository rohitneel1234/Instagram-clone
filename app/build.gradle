plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "kotlin-kapt"
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.rohitneel.instagramclone'
    compileSdk 34

    defaultConfig {
        applicationId "com.rohitneel.instagramclone"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationVariants.all { variant ->
                variant.mergeResources.dependsOn processDebugGoogleServices
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation "androidx.core:core-ktx:${versions.coreKtx}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${versions.lifecycleRuntimeKtx}"
    implementation "androidx.activity:activity-compose:${versions.activityCompose}"
    implementation platform("androidx.compose:compose-bom:${versions.composeBom}")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3:${versions.composeMaterial3}"
    implementation "androidx.navigation:navigation-compose:${versions.navigationCompose}"

    implementation "com.google.firebase:firebase-auth:${versions.firebaseAuth}"
    implementation platform("com.google.firebase:firebase-bom:${versions.firebaseBom}")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-storage-ktx"
    implementation "com.google.android.gms:play-services-auth:${versions.playServicesAuth}"

    implementation "com.google.dagger:hilt-android:${versions.hiltAndroid}"
    implementation "androidx.hilt:hilt-navigation-compose:${versions.hiltNavigationCompose}"
    kapt "com.google.dagger:hilt-android-compiler:${versions.hiltAndroid}"

    implementation "io.coil-kt:coil-compose:${versions.coilCompose}"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${versions.coroutinesAndroid}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:${versions.coroutinesPlayServices}"
    implementation "com.google.accompanist:accompanist-systemuicontroller:${versions.accompanistUiController}"
    implementation "com.google.accompanist:accompanist-pager:${versions.accompanistPager}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${versions.serializationJson}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${versions.lifecycleRuntimeCompose}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${versions.lifecycleViewModelCompose}"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.material:material-icons-extended:${versions.composeMaterialIconsExtended}"

    testImplementation "junit:junit:${versions.junit}"
    androidTestImplementation "androidx.test.ext:junit:${versions.androidTestJunit}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${versions.espressoCore}"
    androidTestImplementation platform("androidx.compose:compose-bom:${versions.composeBom}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}